spring.application.name=despensa-web
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=despensa
spring.data.mongodb.auto-index-creation=false
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=.*
server.tomcat.threads.max=50
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
despensa.url-publica=${URL_PUBLICA:https://despensa-tcc.onrender.com}
despensa.email.brevo-api-key=${BREVO_API_KEY:}
despensa.email.remetente=${EMAIL_REMETENTE:}
despensa.email.remetente-nome=${EMAIL_REMETENTE_NOME:Controle de Despensa}
despensa.alertas.token=${ALERTAS_TOKEN:}
