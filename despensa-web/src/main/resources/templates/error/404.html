<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina(~{::title}, ~{::main})}">
<head>
    <title>Página não encontrada — Despensa</title>
</head>
<body>
<main class="container py-5 pagina-estreita text-center">
    <p class="display-6 text-secondary mb-2">404</p>
    <h1 class="h4">Página não encontrada</h1>
    <p class="text-secondary">O endereço que você abriu não existe ou foi digitado errado.</p>
    <a class="btn btn-success btn-lg w-100" th:href="@{/}">Voltar para a despensa</a>
</main>
</body>
</html>
