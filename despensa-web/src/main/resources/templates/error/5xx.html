<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina(~{::title}, ~{::main})}">
<head>
    <title>Algo deu errado — Despensa</title>
</head>
<body>
<main class="container py-5 pagina-estreita text-center">
    <p class="display-6 text-secondary mb-2" th:text="${status != null and status >= 500 and status < 600 ? status : 500}">500</p>
    <h1 class="h4">Algo deu errado</h1>
    <p class="text-secondary">Tivemos um problema para concluir esta ação. Tente de novo em alguns instantes.</p>
    <a class="btn btn-success btn-lg w-100" th:href="@{/}">Voltar para a despensa</a>
</main>
</body>
</html>
