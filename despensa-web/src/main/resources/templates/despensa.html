<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina(~{::title}, ~{::main})}">
<head>
    <title>Despensa</title>
</head>
<body>
<main class="container py-3">
    <h1 class="h4 mb-3">Itens na despensa</h1>

    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}">Mensagem de sucesso</div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}">Mensagem de erro</div>

    <div class="alert alert-warning" th:if="${quantidadeEmAlerta > 0}">
        Você tem <strong th:text="${quantidadeEmAlerta}">0</strong> item(ns) vencidos ou vencendo em até 7 dias.
    </div>

    <p class="perda-total">
        Perdas acumuladas (itens descartados):
        <strong th:text="|R$ ${#numbers.formatDecimal(perdaTotal, 1, 'POINT', 2, 'COMMA')}|">R$ 0,00</strong>
    </p>

    <div class="text-center text-secondary py-5" th:if="${#lists.isEmpty(itens)}">
        <p class="mb-0">Nenhum item na despensa.</p>
    </div>

    <th:block th:unless="${#lists.isEmpty(itens)}">
        <div th:replace="~{fragments/lista-lotes :: lista(${itens}, 'despensa')}"></div>
    </th:block>
</main>
</body>
</html>
