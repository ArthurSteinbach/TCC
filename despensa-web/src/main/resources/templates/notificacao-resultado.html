<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina(~{::title}, ~{::main})}">
<head>
    <title th:text="|${titulo} — Despensa|">Notificações — Despensa</title>
</head>
<body>
<main class="container py-5 pagina-estreita text-center">

    <p class="text-secondary" th:text="${mensagem}">Mensagem</p>
    <a class="btn btn-success btn-lg w-100" th:href="@{/}">Ir para a despensa</a>
</main>
</body>
</html>
