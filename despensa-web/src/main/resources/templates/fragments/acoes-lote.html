<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="d-flex gap-2 justify-content-end acoes-item" th:fragment="acoes(item, origem)">
    <a class="btn btn-success flex-fill" th:unless="${item.vencido()}"
       th:href="@{/consumir(produtoId=${item.produtoId()},quantidade=1,origem=${origem})}">Consumir</a>
    <a class="btn btn-outline-danger flex-fill"
       th:href="@{/lotes/{p}/{l}/descartar(p=${item.produtoId()},l=${item.loteId()},origem=${origem})}">Descartar</a>
    <a class="btn btn-outline-secondary flex-fill"
       th:href="@{/lotes/{p}/{l}/editar(p=${item.produtoId()},l=${item.loteId()})}">Editar</a>
</div>
</body>
</html>
