<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="pagina(titulo, conteudo)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${titulo}">Despensa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-success" sec:authorize="isAuthenticated()">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Despensa</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}"
                                        th:classappend="${menu == 'despensa'} ? 'active'">Despensa</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cadastrar}"
                                        th:classappend="${menu == 'cadastrar'} ? 'active'">Cadastrar</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/consumir}"
                                        th:classappend="${menu == 'consumir'} ? 'active'">Consumir</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/alertas}"
                                        th:classappend="${menu == 'alertas'} ? 'active'">Alertas</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/relatorio}"
                                        th:classappend="${menu == 'relatorio'} ? 'active'">Relatório</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/produtos}"
                                        th:classappend="${menu == 'produtos'} ? 'active'">Produtos</a></li>
            </ul>
            <div class="d-lg-flex align-items-center gap-3">
                <span class="navbar-text d-block" sec:authentication="principal.nome">Usuário</span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-outline-light w-100 my-2 my-lg-0">Sair</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<main th:replace="${conteudo}">
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
