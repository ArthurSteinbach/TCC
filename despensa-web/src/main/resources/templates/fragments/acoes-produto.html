<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<div class="d-flex gap-2 justify-content-end" th:fragment="acoesProduto(produto)">
    <a class="btn btn-outline-secondary flex-fill"
       th:href="@{/produtos/{id}/editar(id=${produto.id()})}">Editar</a>
    <form method="post" class="flex-fill" th:action="@{/produtos/{id}/excluir(id=${produto.id()})}"
          th:data-confirmacao="|Excluir o produto &quot;${produto.nome()}&quot; (código ${produto.codigoBarras()})? Isso não pode ser desfeito.|">
        <button type="submit" class="btn btn-outline-danger w-100">Excluir</button>
    </form>
</div>
</body>
</html>
