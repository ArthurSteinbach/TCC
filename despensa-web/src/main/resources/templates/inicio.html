<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Controle de Despensa</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>
<main class="cartao">
    <h1>Controle de Despensa</h1>

    <div th:if="${status.conectado}" class="status status-ok">
        <p class="status-titulo">Conexão com o banco OK</p>
        <p>Banco: <strong th:text="${status.nomeBanco}">despensa</strong></p>
    </div>

    <div th:unless="${status.conectado}" class="status status-erro">
        <p class="status-titulo">Não foi possível conectar ao banco</p>
        <p>Banco: <strong th:text="${status.nomeBanco}">despensa</strong></p>
        <p>Confira a variável de ambiente MONGODB_URI e se o seu IP está liberado no MongoDB Atlas.</p>
        <p class="detalhe" th:text="${status.erro}">MongoTimeoutException</p>
    </div>
</main>
</body>
</html>
