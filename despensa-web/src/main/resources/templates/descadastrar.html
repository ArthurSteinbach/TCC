<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina(~{::title}, ~{::main})}">
<head>
    <title>Desligar avisos — Despensa</title>
</head>
<body>
<main class="container py-5 pagina-estreita text-center">
    <h1 class="h4">Desligar os avisos por e-mail?</h1>
    <p class="text-secondary">
        Os avisos de vencimento deixam de ser enviados para
        <strong th:text="${emailMascarado}">a***@exemplo.com</strong>.
    </p>
    <form th:action="@{/notificacoes/descadastrar}" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <button type="submit" class="btn btn-danger btn-lg w-100 mb-2">Sim, desligar os avisos</button>
    </form>
    <a class="btn btn-outline-secondary btn-lg w-100" th:href="@{/}">Cancelar</a>
</main>
</body>
</html>
